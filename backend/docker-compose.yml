services:
  postgres:
    image: postgres:15-alpine
    container_name: fusion-erp-postgres
    environment:
      POSTGRES_DB: fusion_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fusion-network

  redis:
    image: redis:7-alpine
    container_name: fusion-erp-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - fusion-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fusion-erp-backend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/fusion_erp
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - fusion-network
    command: npm run start:dev

volumes:
  postgres_data:
  redis_data:

networks:
  fusion-network:
    driver: bridge